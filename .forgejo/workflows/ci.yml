name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Byte-compile Python
        run: python -m compileall -q addons components migration scripts

      - name: Run tests
        run: pytest
