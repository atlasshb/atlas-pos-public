name: Odoo module install (experimental)

# Manual only: this spins up Odoo 19 + Postgres and installs the modules.
# Adjust the image tag / addons path if your Odoo layout differs.

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install modules on Odoo 19 Community
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/addons:/mnt/extra-addons" \
            odoo:19.0 odoo \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            -d odoo \
            -i base,atlas_pos_seed,atlas_pos_theme,pos_pinvandaag_atlas \
            --without-demo=all --stop-after-init
